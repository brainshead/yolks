name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  discover_yolks:
    name: Discover Wine yolks
    runs-on: ubuntu-latest
    outputs:
      yolk_matrix: ${{ steps.set_matrix.outputs.yolk_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find wine yolk folders
        id: set_matrix
        run: |
          echo "Finding all wine yolk folders..."
          yolks=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf "%f," | grep -v '^$' | sed 's/,$//')
          echo "Found yolks: $yolks"
          echo "yolk_matrix=$yolks" >> $GITHUB_OUTPUT

  build_each:
    name: Build & Push each Wine yolk
    needs: discover_yolks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yolk: ${{ fromJSON('["' + replace(needs.discover_yolks.outputs.yolk_matrix, ',', '","') + '"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.yolk }} yolk
        uses: docker/build-push-action@v6
        with:
          context: .  # repo root
          file: ./wine/${{ matrix.yolk }}/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            DEBIAN_FRONTEND=noninteractive
            ENTRYPOINT_PATH=./wine/entrypoint.sh
          tags: |
            ghcr.io/${{ github.repository_owner }}/yolks:${{ matrix.yolk }}
