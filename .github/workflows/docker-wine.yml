name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover Wine yolk folders
        id: yolks
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf '%f ')
          echo "Found yolks: $yolk_dirs"
          echo "yolks=$yolk_dirs" >> $GITHUB_OUTPUT

      - name: Build and push each Wine yolk
        run: |
          echo "====================================="
          echo "  Building and pushing Wine yolks..."
          echo "====================================="
          summary_file="build_summary.txt"
          echo "| Yolk Folder | GHCR Tags |" > $summary_file
          echo "|--------------|------------|" >> $summary_file

          for dir in ${{ steps.yolks.outputs.yolks }}; do
            if [ ! -f "./wine/$dir/Dockerfile" ]; then
              echo "⚠️ Skipping '$dir' — no Dockerfile found."
              continue
            fi

            echo ""
            echo "🧩 Building yolk: $dir"
            echo "-------------------------------------"

            docker buildx build \
              --file "./wine/$dir/Dockerfile" \
              --build-arg DEBIAN_FRONTEND=noninteractive \
              --platform linux/amd64 \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}" \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_devel" \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_latest" \
              --push \
              .

            echo "| $dir | ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}\n\
ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_devel\n\
ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_latest |" >> $summary_file
          done

          echo ""
          echo "✅ All Wine yolks built and pushed (or skipped if missing Dockerfile)."
          echo ""
          echo "📦 Build Summary:"
          cat $summary_file >> $GITHUB_STEP_SUMMARY
