name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  discover:
    name: Discover Wine Yolks
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.yolks.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Wine yolk folders
        id: yolks
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort)
          echo "Found yolks:"
          echo "$yolk_dirs"
          json_array=$(printf '%s\n' $yolk_dirs | jq -R . | jq -s .)
          echo "matrix=$json_array" >> $GITHUB_OUTPUT

  build_each:
    name: Build & Push ${{ matrix.yolk }}
    runs-on: ubuntu-latest
    needs: discover

    strategy:
      matrix:
        yolk: ${{ fromJson(needs.discover.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.yolk }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./wine/${{ matrix.yolk }}
          file: ./wine/${{ matrix.yolk }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_latest
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_devel
          build-args: |
            DEBIAN_FRONTEND=noninteractive

      - name: Build Summary
        run: |
          echo "--------------------------------------------"
          echo "Successfully built and pushed the following images for ${{ matrix.yolk }}:"
          echo " - ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_latest"
          echo " - ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_devel"
          echo "--------------------------------------------"
