name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover Wine yolk folders
        id: yolks
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          echo "Found yolks: $yolk_dirs"
          echo "yolks<<EOF" >> $GITHUB_OUTPUT
          echo "$yolk_dirs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push each Wine yolk
        run: |
          for dir in ${{ steps.yolks.outputs.yolks }}; do
            echo "====================================="
            echo " Building and pushing yolk: $dir"
            echo "====================================="

            docker buildx build \
              --file "./wine/$dir/Dockerfile" \
              --build-arg DEBIAN_FRONTEND=noninteractive \
              --platform linux/amd64 \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}" \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_devel" \
              --tag "ghcr.io/${{ github.repository_owner }}/yolks:wine_${dir}_latest" \
              --push \
              .

          done
