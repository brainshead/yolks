name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  build_each:
    name: Build & Push Wine Yolk ${{ matrix.yolk_folder }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # Matrix will be generated dynamically in a preceding step
    strategy:
      matrix:
        yolk_folder: []

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover Wine yolks
        id: yolks
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort)
          echo "Found yolks:"
          echo "$yolk_dirs"

          # Convert to JSON array safely for matrix
          json_array=$(printf '%s\n' $yolk_dirs | jq -R . | jq -s .)
          echo "matrix=$json_array" >> $GITHUB_OUTPUT

      - name: Set matrix
        id: set-matrix
        run: echo "matrix=$(echo '${{ steps.yolks.outputs.matrix }}')" >> $GITHUB_OUTPUT
        # NOTE: This step is mainly for visibility. The actual matrix injection may need `fromJson` in the job.

  build_matrix:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest
    needs: build_each

    strategy:
      matrix:
        yolk_folder: ${{ fromJson(needs.build_each.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Wine yolk ${{ matrix.yolk_folder }}
        uses: docker/build-push-action@v6
        with:
          context: ./wine/${{ matrix.yolk_folder }}
          file: ./wine/${{ matrix.yolk_folder }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk_folder }}_devel
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk_folder }}_latest
