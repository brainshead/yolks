name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  discover_yolks:
    name: Discover Wine Yolks
    runs-on: ubuntu-latest
    outputs:
      yolk_list: ${{ steps.set_outputs.outputs.yolk_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Wine yolks output
        id: set_outputs
        run: |
          yolks=$(find ./wine -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          echo "Found yolks: $yolks"
          # Convert space-separated list to comma-separated
          yolks_csv=$(echo $yolks | tr ' ' ',')
          echo "yolk_list=$yolks_csv" >> $GITHUB_OUTPUT

  build_each:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest
    needs: discover_yolks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push each Wine yolk
        run: |
          IFS=',' read -r -a yolk_array <<< "${{ needs.discover_yolks.outputs.yolk_list }}"
          for yolk in "${yolk_array[@]}"; do
            echo "======================================"
            echo "Building yolk: $yolk"
            echo "======================================"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -t ghcr.io/${{ github.repository_owner }}/yolks:wine_${yolk} \
              -f ./wine/$yolk/Dockerfile \
              ./wine
          done
