name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  discover_yolks:
    name: Discover Wine yolks
    runs-on: ubuntu-latest
    outputs:
      yolk_matrix: ${{ steps.set_matrix.outputs.yolk_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find wine yolk folders
        id: set_matrix
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | paste -sd "," -)
          echo "Found yolks: $yolk_dirs"
          echo "yolk_matrix=$yolk_dirs" >> $GITHUB_OUTPUT

  build_each:
    name: Build & Push Wine Yolk ${{ matrix.yolk }}
    needs: discover_yolks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yolk: ${{ fromJSON('["'  }}${{ replace(needs.discover_yolks.outputs.yolk_matrix, ',', '","') }}${{ '"]') }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.yolk }}
        run: |
          echo "Building yolk: ${{ matrix.yolk }}"
          docker buildx build \
            --file ./wine/${{ matrix.yolk }}/Dockerfile \
            --platform linux/amd64 \
            --push \
            -t ghcr.io/${{ github.repository_owner }}/yolks:${{ matrix.yolk }} \
            ./wine/${{ matrix.yolk }}
