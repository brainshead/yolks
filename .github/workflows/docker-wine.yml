name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Discover all wine yolks
      - name: Discover Wine yolks
        id: discover_yolks
        run: |
          yolks=$(find ./wine -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          yolks_csv=$(echo $yolks | tr ' ' ',')
          echo "yolks=$yolks_csv" >> $GITHUB_OUTPUT
          echo "Found yolks: $yolks_csv"

      # Build & push each yolk
      - name: Build & push Wine yolks
        run: |
          IFS=',' read -ra yolk_array <<< "${{ steps.discover_yolks.outputs.yolks }}"
          for yolk in "${yolk_array[@]}"; do
            echo "Building $yolk..."
            docker buildx build \
              --file wine/$yolk/Dockerfile \
              --platform linux/amd64 \
              --push \
              --tag ghcr.io/${{ github.repository_owner }}/yolks:wine_$yolk \
              wine/$yolk
          done
