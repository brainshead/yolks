name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        yolk-folder: [staging, latest, devel, ubuntu24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.yolk-folder }} yolk
        uses: docker/build-push-action@v6
        with:
          context: ./wine                     # <-- context includes entrypoint.sh
          file: ./wine/${{ matrix.yolk-folder }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk-folder }}
