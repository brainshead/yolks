name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/docker-wine.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover Wine yolks
        id: yolks
        run: |
          echo "Finding all wine yolk folders..."
          yolk_dirs=$(find ./wine -mindepth 1 -maxdepth 1 -type d -printf "%f\n")
          echo "Found yolks: $yolk_dirs"
          # Export to matrix format (JSON array)
          echo "matrix=$(jq -nc --argjson arr "$(printf '%s\n' $yolk_dirs | jq -R . | jq -s .)" '$arr')" >> $GITHUB_OUTPUT

  build_each:
    name: Build & Push ${{ matrix.yolk }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        yolk: ${{ fromJson(needs.build.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.yolk }}
        uses: docker/build-push-action@v6
        with:
          context: ./wine/${{ matrix.yolk }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_latest
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk }}_devel
          build-args: |
            DEBIAN_FRONTEND=noninteractive
