name: Build and Publish Wine Yolks

on:
  push:
    branches:
      - main
      - brainshead-patch-1
    paths:
      - 'wine/**'
      - '.github/workflows/build.yml'
      - 'entrypoint.sh'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Wine Yolks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        yolk-folder: [staging, latest, devel, ubuntu24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          DOCKERFILE_PATH=$(find ./wine/${{ matrix.yolk-folder }} -maxdepth 1 -type f -iname 'Dockerfile*' | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "No Dockerfile found in ./wine/${{ matrix.yolk-folder }}"
            exit 1
          fi
          echo "Dockerfile found: $DOCKERFILE_PATH"
          echo "dockerfile=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT

      - name: Build & push Wine yolk ${{ matrix.yolk-folder }}
        uses: docker/build-push-action@v6
        with:
          context: ./wine/${{ matrix.yolk-folder }}
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk-folder }}_devel
            ghcr.io/${{ github.repository_owner }}/yolks:wine_${{ matrix.yolk-folder }}_latest
          build-args: |
            ENTRYPOINT_PATH=../../entrypoint.sh
